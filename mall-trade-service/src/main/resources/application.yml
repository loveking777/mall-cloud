spring:
  application:
    name: mall-trade-service

  datasource:
    url: "jdbc:mysql://localhost:3306/trade_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: "root"
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

server:
  port: 8082

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

mall:
  inventory:
    recovery:
      # 是否开启库存补偿恢复任务
      enabled: true
      # 上一次执行结束后，间隔多久再执行（毫秒）
      interval-ms: 60000
      # 记录至少多久没有变化，才认为"卡住了"，需要恢复任务介入
      stale-minutes: 2
      # 单次最多处理多少条，避免一次扫太多拖垮服务
      batch-size: 100
